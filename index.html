<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142431"><title>ER.TCS — Season 13 교류 등록 문서</title><link rel="stylesheet" href="style.css?v=11"><style>
/* Final-card editor: overlay never participates in PNG export */
.card-editor-tools{margin:12px 0;padding:13px;border:1px solid #8198a3;border-radius:12px;background:#1d3441;color:#f1eee3;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.card-editor-tools button,.card-editor-tools select,.card-editor-tools input{border:1px solid #9bafba;border-radius:7px;padding:8px;background:#f3f0e6;color:#172632;min-height:38px}
.card-editor-tools button.active{background:#b8dbe2;color:#142431;font-weight:bold}
.card-editor-tools label{display:flex;align-items:center;gap:5px;font-size:13px}.card-editor-tools input[type=number]{width:68px}
.card-editor-hint{width:100%;font-size:12px;color:#c9d3cf}.card-edit-layer{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:5;cursor:move}
.canvas-wrap{position:relative}.card-editor-tools[hidden],.card-edit-layer[hidden]{display:none!important}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><span class="brand-mark">✧</span><div><small>ETERNAL RETURN · SEASON 13</small><strong>ER.TCS <em>트친소 메이커</em></strong></div></div><span class="prototype">시즌 13 · 공증 문서</span></header>
<div class="layout"><aside class="sidebar"><div class="side-heading">기록 만들기 <span>✦</span></div><nav id="stepNav" aria-label="제작 단계"></nav><div class="side-foot">나만의 기록을 완성해 보세요.<br><small>입력 내용은 이 브라우저에 자동 저장됩니다.</small></div></aside>
<main class="main"><div class="main-heading"><div><div class="eyebrow" id="stepCounter">01 / 06 · 이름</div><h1 id="stepTitle">어떤 이름으로 불리고 싶으신가요?</h1><p id="stepDescription">프로필에 표시될 이름과 소개를 작성해 주세요.</p></div><div class="ornament">✧</div></div><div class="content" id="creationContent"><div class="page-turn" id="pageTurn" aria-hidden="true"><div class="page-turn-front"></div><div class="page-turn-back"></div></div><section class="form-panel"><div id="stepFields"></div><div class="controls"><button type="button" id="prevBtn" class="secondary">← 이전</button><button type="button" id="nextBtn" class="primary">다음 단계 →</button></div></section><section class="reveal-panel" id="revealPanel" hidden><div class="reveal-title">기록이 완성되었습니다</div><div class="reveal-caption">완성된 트친소를 확인해 보세요.</div><div class="card-editor-tools" id="cardEditorToolbar"><button type="button" id="editToggle">영역 후조정 켜기</button><button type="button" id="editReset">배치 초기화</button><button type="button" id="editSave">영역 JSON 저장</button><label>영역 <select id="editSelect"></select></label><label>X <input id="editX" type="number" step="1"></label><label>Y <input id="editY" type="number" step="1"></label><label>너비 <input id="editW" type="number" step="1" min="20"></label><label>높이 <input id="editH" type="number" step="1" min="20"></label><div class="card-editor-hint">예시 내용은 입력값이 없을 때만 표시돼. 편집 모드를 켜고 영역을 끌어 옮기거나 오른쪽 아래 손잡이로 크기를 조절해. 실제 PNG에는 편집선이 없어.</div></div><div class="canvas-wrap"><canvas id="profileCanvas" width="1000" height="1414" aria-label="완성된 트친소 카드"></canvas><canvas id="editOverlay" class="card-edit-layer" width="1000" height="1414" hidden></canvas></div><button type="button" class="primary action" id="downloadSmall">PNG 이미지 저장 ↓</button></section></div></main></div></div>
<script src="script.js?v=16"></script></body></html>

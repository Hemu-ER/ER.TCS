name: 실험체 데이터 자동 갱신

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * *" # 매일 04:20 KST

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install requests

      - name: 실험체 목록 및 초상화 갱신
        run: python scripts/sync_characters.py

      - name: 변경사항 커밋
        run: |
          git config user.name "ER.TCS Bot"
          git config user.email "actions@users.noreply.github.com"
          git add characters.json assets/characters
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "auto: 실험체 데이터 갱신"
            git push
          fi
